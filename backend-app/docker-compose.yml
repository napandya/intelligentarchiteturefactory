version: "3.9"

# Local dev for the iAF backend platform. In production each piece is deployed
# by the platform; the gateway proxies to services via *_SERVICE_URL env vars.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iaf
      POSTGRES_PASSWORD: iaf
      POSTGRES_DB: iaf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaf"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./services
    command: uvicorn app.main:app --host 0.0.0.0 --port 8021 --app-dir /svc/auth
    environment:
      DATABASE_URL: postgresql+asyncpg://iaf:iaf@postgres:5432/iaf
    ports:
      - "8021:8021"
    depends_on:
      postgres:
        condition: service_healthy

  assistant:
    build: ./services
    command: uvicorn app.main:app --host 0.0.0.0 --port 8022 --app-dir /svc/assistant
    environment:
      DATABASE_URL: postgresql+asyncpg://iaf:iaf@postgres:5432/iaf
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
    ports:
      - "8022:8022"
    depends_on:
      postgres:
        condition: service_healthy

  files:
    build: ./services
    command: uvicorn app.main:app --host 0.0.0.0 --port 8023 --app-dir /svc/files
    environment:
      DATABASE_URL: postgresql+asyncpg://iaf:iaf@postgres:5432/iaf
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
    ports:
      - "8023:8023"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./gateway
    environment:
      GATEWAY_ADDR: ":8090"
      AUTH_SERVICE_URL: http://auth:8021
      ASSISTANT_SERVICE_URL: http://assistant:8022
      FILES_SERVICE_URL: http://files:8023
      LEGACY_BACKEND_URL: ${LEGACY_BACKEND_URL:-http://host.docker.internal:8001}
    ports:
      - "8090:8090"
    depends_on:
      - auth
      - assistant
      - files

volumes:
  pgdata:
